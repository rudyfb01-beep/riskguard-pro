version: '3.8'

services:
  # ============================================================================
  # 1. MOTOR DE BASE DE DATOS: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: custodia-risk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: custodia_risk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Inicialización automática en el primer arranque:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d custodia_risk"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - custodia-network

  # ============================================================================
  # 2. APLICACIÓN WEB FULL-STACK: Angular 21 + SSR Express
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: custodia-risk-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/custodia_risk
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - custodia-network

  # ============================================================================
  # 3. INTERFAZ WEB DE GESTIÓN SQL: Adminer (Opcional en http://localhost:8080)
  # ============================================================================
  adminer:
    image: adminer:latest
    container_name: custodia-risk-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - custodia-network

volumes:
  pgdata:
    driver: local

networks:
  custodia-network:
    driver: bridge
