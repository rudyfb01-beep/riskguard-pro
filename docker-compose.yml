services:
  # ============================================================================
  # 1. MOTOR DE BASE DE DATOS: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: custodia-risk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: custodia_risk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # El esquema lo aplica (y migra) la aplicación en cada arranque.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d custodia_risk"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - custodia-network

  # ============================================================================
  # 2. APLICACIÓN WEB FULL-STACK: Angular 21 + SSR Express
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: custodia-risk-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/custodia_risk
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # true: carga datos de ejemplo ficticios en una base vacía (para evaluar).
      # En producción usar false: se crean solo cargos, plazos y un administrador.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Correo para enviar los códigos de acceso (Google Workspace: ver LOCAL_SETUP.md).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_HELO_NAME: ${SMTP_HELO_NAME:-}
      # Solo para evaluar sin SMTP: los códigos se muestran en `docker compose logs app`.
      # En producción debe ser false.
      AUTH_DEV_LOG_CODES: ${AUTH_DEV_LOG_CODES:-true}
      AUTH_SECRET: ${AUTH_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Avisos: enlaces de los correos, hora del resumen diario y frecuencia de revisión de plazos.
      APP_URL: ${APP_URL:-http://localhost:3000}
      TZ: ${TZ:-America/Santiago}
      NOTIFY_INTERVAL_MINUTES: ${NOTIFY_INTERVAL_MINUTES:-15}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - custodia-network

  # ============================================================================
  # 3. INTERFAZ WEB DE GESTIÓN SQL: Adminer (Opcional en http://localhost:8080)
  # ============================================================================
  adminer:
    image: adminer:latest
    container_name: custodia-risk-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - custodia-network

volumes:
  pgdata:
    driver: local

networks:
  custodia-network:
    driver: bridge
