# ==============================================================================
# RiskGuard Pro — despliegue de producción (Docker Compose)
#
#   1. cp .env.example .env   y complete las variables marcadas como OBLIGATORIAS.
#   2. docker compose up -d --build                       (proxy HTTPS propio de la cooperativa)
#      docker compose --profile https up -d --build       (con Caddy como proxy HTTPS incluido)
#
# Ver LOCAL_SETUP.md → "Producción" y docs/OPERACION.md.
# ==============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: riskguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-riskguard}
      POSTGRES_USER: ${POSTGRES_USER:-riskguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    # Sin puerto publicado: la base solo es accesible desde la red interna de Docker.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [interna]

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-}
    image: riskguard-pro:${APP_VERSION:-latest}
    container_name: riskguard-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-riskguard}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-riskguard}
      # Dirección pública con HTTPS (enlaces de los correos, retorno de Google y cookies seguras).
      APP_URL: ${APP_URL:?Defina APP_URL en .env (p. ej. https://grc.cooperativa.cl)}
      AUTH_SECRET: ${AUTH_SECRET:?Defina AUTH_SECRET en .env (openssl rand -hex 32)}
      # Correo del administrador inicial (solo se usa en una base nueva).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_HELO_NAME: ${SMTP_HELO_NAME:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-}
      AUTH_EMAIL_CODE: ${AUTH_EMAIL_CODE:-true}
      # true: correo y contraseña (sin SMTP). Primer acceso: server.mjs contrasena <correo>
      AUTH_PASSWORD: ${AUTH_PASSWORD:-false}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
      SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-10}
      # La aplicación queda detrás de un proxy HTTPS (un salto): IP real y cookie Secure.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      TZ: ${TZ:-America/Santiago}
      NOTIFY_INTERVAL_MINUTES: ${NOTIFY_INTERVAL_MINUTES:-15}
      UF_AUTO_SYNC: ${UF_AUTO_SYNC:-true}
      EVIDENCE_MAX_MB: ${EVIDENCE_MAX_MB:-15}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-}
      SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - backups:/app/backups
    # Solo en el propio servidor: el acceso de los usuarios es por el proxy HTTPS.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

  # Proxy HTTPS opcional (perfil "https"). TLS_MODE=internal usa la CA interna de Caddy;
  # con un correo en TLS_MODE y un dominio público obtiene un certificado de Let's Encrypt.
  caddy:
    image: caddy:2-alpine
    container_name: riskguard-caddy
    profiles: [https]
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
      TLS_MODE: ${TLS_MODE:-internal}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [interna]

  # Consola SQL opcional (perfil "herramientas"), solo en el propio servidor.
  adminer:
    image: adminer:5
    container_name: riskguard-adminer
    profiles: [herramientas]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks: [interna]

volumes:
  pgdata:
  backups:
  caddy_data:
  caddy_config:

networks:
  interna:
    driver: bridge
