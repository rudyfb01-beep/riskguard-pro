# Integración continua: lint, pruebas unitarias, build, pruebas de API (SQLite y PostgreSQL),
# prueba de humo en el navegador y auditoría de dependencias de producción.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: America/Santiago

jobs:
  build:
    name: Lint, unitarias y build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: npx ng lint
      - run: npx ng test --watch=false
      - run: npx ng build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 3

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Falla si hay vulnerabilidades en las dependencias que van a producción.
      - run: bun audit --prod
      # Herramientas de desarrollo: solo informativo.
      - run: bun audit || true

  api-sqlite:
    name: API (SQLite)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: node --test --test-concurrency=2 "tests/api/*.test.mjs"

  api-postgres:
    name: API (PostgreSQL 16)
    needs: build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-password@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # Esquema idempotente: se aplica dos veces.
      - run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE esquema'
          for i in 1 2; do psql "${TEST_DATABASE_URL%/postgres}/esquema" -v ON_ERROR_STOP=1 -q -f database/schema.sql; done
      - run: node --test --test-concurrency=2 "tests/api/*.test.mjs"

  e2e:
    name: Navegador (Playwright)
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: node --test "tests/e2e/*.test.mjs"

  produccion-docker:
    name: Producción (Docker Compose + HTTPS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configuración de producción (.env)
        run: |
          cat > .env <<ENV
          APP_URL=https://localhost
          APP_DOMAIN=localhost
          TLS_MODE=internal
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          AUTH_SECRET=$(openssl rand -hex 32)
          ADMIN_EMAIL=riesgo@cooperativa.cl
          SMTP_HOST=mailpit
          SMTP_PORT=1025
          SMTP_FROM=RiskGuard Pro <grc@cooperativa.cl>
          UF_AUTO_SYNC=false
          APP_VERSION=ci-${GITHUB_SHA::7}
          ENV
          chmod 600 .env
      - name: La configuración insegura no arranca
        run: |
          docker compose build app
          set +e
          out=$(docker compose run --rm --no-deps -e AUTH_DEV_LOG_CODES=true -e AUTH_SECRET=corto app 2>&1)
          code=$?
          set -e
          echo "$out"
          test $code -ne 0
          echo "$out" | grep -q "AUTH_DEV_LOG_CODES=true"
          echo "$out" | grep -q "AUTH_SECRET debe tener"
      - name: Levantar (PostgreSQL, aplicación y proxy HTTPS)
        run: docker compose -f docker-compose.yml -f deploy/ci.override.yml --profile https up -d --wait --wait-timeout 180
      - name: Certificado de la CA interna
        run: docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt ./caddy-root.crt
      - name: Verificación de la instalación
        env:
          PROD_URL: https://localhost
          ADMIN_EMAIL: riesgo@cooperativa.cl
          MAILPIT_URL: http://localhost:8025
          NODE_EXTRA_CA_CERTS: caddy-root.crt
        run: node tests/produccion/smoke.mjs
      - name: Puertos expuestos y restauración del respaldo
        run: |
          if docker compose port postgres 5432 2>/dev/null | grep -q ':'; then echo 'PostgreSQL publicado'; exit 1; fi
          docker compose port app 3000 | grep -q '^127.0.0.1:'
          curl -sI http://localhost/ | grep -qi '^location: https://'
          file=$(docker compose exec -T app sh -c 'ls -t /app/backups/*.dump | head -1')
          docker compose exec -T app node scripts/restaurar.mjs "$file" --verificar
      - name: Reinicio conserva los datos
        env:
          PROD_URL: https://localhost
          ADMIN_EMAIL: riesgo@cooperativa.cl
          MAILPIT_URL: http://localhost:8025
          NODE_EXTRA_CA_CERTS: caddy-root.crt
        run: |
          docker compose restart app
          docker compose -f docker-compose.yml -f deploy/ci.override.yml --profile https up -d --wait --wait-timeout 120
          node tests/produccion/smoke.mjs
      - name: Registros
        if: always()
        run: docker compose -f docker-compose.yml -f deploy/ci.override.yml --profile https logs --no-color | tail -200
