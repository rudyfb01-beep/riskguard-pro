# Solo para la verificación de producción en CI: servidor de correo de prueba (Mailpit).
services:
  mailpit:
    image: axllent/mailpit:v1.20.0
    container_name: riskguard-mailpit
    ports:
      - "127.0.0.1:8025:8025"
    networks: [interna]
  app:
    depends_on:
      mailpit:
        condition: service_started
